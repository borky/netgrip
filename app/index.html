<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NetGrip</title>
    <script>
      // Tema antes del primer paint (evita FOUC). Claro por defecto; solo se
      // respeta prefers-color-scheme si el usuario no eligió tema todavía.
      (function () {
        try {
          var t = localStorage.getItem("netgrip:theme");
          var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var d = localStorage.getItem("netgrip:density");
          document.documentElement.dataset.density = d === "compact" ? "compact" : "comfortable";
          // Language before the first paint, for the same reason as the
          // theme: the static attribute is only the fallback, and the
          // browser may read it before i18next starts. Same detection as
          // i18n.ts: what was chosen, else the browser's.
          var l = localStorage.getItem("netgrip-lang") || navigator.language || "";
          document.documentElement.lang = l.slice(0, 2).toLowerCase() === "es" ? "es" : "en";
        } catch (e) { /* sin tema */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
